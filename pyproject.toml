[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armorer-guard"
version = "1.0.0"
description = "Client SDK for connecting agent applications to an Armorer Guard runtime."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md", "NOTICE.md"]
authors = [{ name = "Armorer Labs", email = "dev@armorerlabs.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://armorerlabs.com"
Repository = "https://github.com/ArmorerLabs/Armorer-Guard"

[tool.setuptools.packages.find]
include = ["armorer_guard*"]

[tool.setuptools.package-data]
armorer_guard = ["py.typed"]
