name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  clients:
    name: Public clients (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: |
            npm/armorer-guard/package-lock.json
            examples/langgraph-typescript/package-lock.json

      - name: Test Python client
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pytest -q
          python -m build

      - name: Test Node client
        run: npm test --prefix npm/armorer-guard

      - name: Test LangGraph TypeScript integration
        run: |
          npm ci --prefix examples/langgraph-typescript
          npm test --prefix examples/langgraph-typescript

      - name: Validate public JSON schema
        run: |
          python -m pip install check-jsonschema
          check-jsonschema --check-metaschema schemas/armorer-guard-runtime.schema.json
