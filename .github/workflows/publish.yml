name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release service binary
        run: cargo build --release --locked

      - name: Stage release service binary
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/armorer-guard.exe release-artifacts/armorer-guard-windows-x86_64.exe
          else
            cp target/release/armorer-guard "release-artifacts/armorer-guard-${RUNNER_OS}-${RUNNER_ARCH}"
          fi

      - name: Upload service binary
        uses: actions/upload-artifact@v4
        with:
          name: guard-binary-${{ matrix.os }}
          path: release-artifacts/*

      - name: Set up QEMU for Linux arm64 wheels
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.3
        env:
          CIBW_BUILD: cp310-*
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS_LINUX: x86_64 aarch64
          CIBW_BEFORE_ALL_LINUX: curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"
          CIBW_TEST_COMMAND: python -c "import armorer_guard; result = armorer_guard.inspect_input('GH_TOKEN=dummyGithubToken123456789'); assert '[REDACTED_SECRET_VALUE]' in result.sanitized_text"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: Download service binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: guard-binary-*
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

      - name: Generate artifact checksums
        run: |
          find dist binaries -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/**/*.whl"

      - name: Attest service-binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "binaries/*"

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: SHA256SUMS
